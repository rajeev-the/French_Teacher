<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E394D"/>
      <stop offset="100%" stop-color="#12222E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="rgba(243, 229, 171, 0.4)" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Subtle Academic Laurel / Geometry Accent -->
  <path d="M 60 18 L 63 25 L 60 23 L 57 25 Z" fill="url(#goldGrad)"/>
  <path d="M 60 102 L 63 95 L 60 97 L 57 95 Z" fill="url(#goldGrad)"/>
  <circle cx="28" cy="60" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="92" cy="60" r="1.5" fill="url(#goldGrad)"/>

  <!-- Elegant Monogram SA (Shikha Arya) -->
  <text x="60" y="69" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" 
        font-size="36" 
        font-weight="700" 
        letter-spacing="1.5"
        fill="#F8F5EF">SA</text>

  <!-- Subtitle Text Ring: MATHS & FRENCH -->
  <text x="60" y="82"
        text-anchor="middle"
        font-family="'Source Sans 3', Lato, sans-serif"
        font-size="6.5"
        font-weight="700"
        letter-spacing="2.5"
        fill="url(#goldGrad)">MATHS &bull; FRENCH</text>
</svg>
